<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title></title>
</head>
<body>
<div id="output"></div>

<script>
    let i = 1;
    let text = "";

    while (i <= 3) {          // 3 dòng
        let j = 1;
        while (j <= 5) {        // 5 lần mỗi dòng
            text += "Hello ";
            j++;
        }
        text += "<br>";
        i++;
    }

    document.getElementById("output").innerHTML = text;
</script>

</body>
</html>
