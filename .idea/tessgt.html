<!DOCTYPE html>
<html>
<body>

<table border="1" cellpadding="10">

    <script>
        for(let i=1; i<=10 ; i++) {
            document.write("<tr>")
        for (let j=1; j<=10 ; j++) {
            document.write("<td>" + j + "+" + i +"="+ (i+j) + "</td>")
        }
        document.write("</tr>");
        }

    </script>

</table>

</body>
</html>
