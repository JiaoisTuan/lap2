<!DOCTYPE html>
<html>
<body>

<table border="1" cellpadding="10">

    <script>
        for (let i = 1; i <= 10; i++) {      // HÀNG (1*?, 2*?, 3*?)
            document.write("<tr>");

            for (let j = 1; j <= 10; j++) { // CỘT (?*1, ?*2, ?*3)
                document.write("<td>" + j + "*" + i + "=" + (j*i) + "</td>");

            }

            document.write("</tr>");
        }
    </script>

</table>

</body>
</html>
